<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Virtual Creator Studio v2</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#e5e7eb;background:#0b1020}*{box-sizing:border-box}body{margin:0}header{padding:20px;background:#111827;border-bottom:1px solid #374151}h1{margin:0;font-size:23px}small,.muted{color:#9ca3af}nav{display:flex;overflow:auto;gap:8px;padding:12px;background:#111827;position:sticky;top:0}button{cursor:pointer;background:#7c3aed;color:white;border:0;border-radius:9px;padding:11px 14px;font-weight:600}nav button{background:#273244;white-space:nowrap}nav button.active{background:#7c3aed}main{max-width:950px;margin:auto;padding:18px}.panel{background:#161f33;border:1px solid #344057;border-radius:14px;padding:18px;margin:14px 0}input,textarea,select{width:100%;background:#0c1426;color:white;border:1px solid #475569;border-radius:8px;padding:11px;margin:5px 0 12px;font:inherit}textarea{min-height:90px}label{display:block;font-size:13px;color:#cbd5e1} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metric{font-size:27px;font-weight:800}.item{border-top:1px solid #344057;padding:12px 0}.actions{display:flex;flex-wrap:wrap;gap:7px}.secondary{background:#334155}.danger{background:#9f1239}.pill{display:inline-block;background:#334155;padding:4px 8px;border-radius:12px;font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c1426;padding:12px;border-radius:8px}a{color:#c4b5fd}#notice{padding:10px;color:#a7f3d0}img.preview{max-width:100%;max-height:300px;border-radius:12px}section[hidden]{display:none}</style></head><body><header><h1>✦ Virtual Creator Studio <small>v2 · iPhone-first</small></h1><div class="muted">Local-first creator dashboard · no account required</div></header><nav id="nav"></nav><main><div id="notice" aria-live="polite"></div><div id="view"></div></main><script>
const KEY='vcs_v2_data';const tabs=['Dashboard','Characters','Studio','Calendar','Companion','Analytics','Integrations','Settings'];let tab='Dashboard';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{};data=data||{characters:[{id:'c1',name:'Mara Vale',age:27,style:'Photorealistic editorial glamour',voice:'Playful, confident, witty',disclosure:'Fictional AI-generated adult character'}],posts:[],metrics:[],messages:[],settings:{backend:'',approval:true},jobs:[]};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());function save(){localStorage.setItem(KEY,JSON.stringify(data));}function note(s){$('#notice').textContent=s;setTimeout(()=>{if($('#notice'))$('#notice').textContent=''},4000)}function field(label,id,val='',type='text'){return `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}">`};function area(label,id,val=''){return `<label for="${id}">${label}</label><textarea id="${id}">${esc(val)}</textarea>`};function render(){ $('#nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let html='';if(tab==='Dashboard'){let scheduled=data.posts.filter(p=>p.status==='Scheduled').length;html=`<div class="grid"><div class="panel"><div class="muted">Characters</div><div class="metric">${data.characters.length}</div></div><div class="panel"><div class="muted">Drafts</div><div class="metric">${data.posts.filter(p=>p.status==='Draft').length}</div></div><div class="panel"><div class="muted">Scheduled</div><div class="metric">${scheduled}</div></div><div class="panel"><div class="muted">Recorded revenue</div><div class="metric">$${data.metrics.reduce((s,m)=>s+Number(m.revenue||0),0).toFixed(2)}</div></div></div><div class="panel"><h2>Production pipeline</h2><p>Character → draft → approval → scheduled queue → authorized API publisher.</p><p class="muted">Scheduled posts do not publish while this page is closed. A hosted backend and authorized platform credentials are required for unattended publishing.</p><button onclick="tab='Studio';render()">Create a post</button></div>`}
if(tab==='Characters'){html=`<div class="panel"><h2>New character</h2>${field('Character name','cn')}${field('Fictional adult age (18+)','ca','27','number')}${field('Appearance / style','cs')}${field('Personality / tone','cv')}<button onclick="addCharacter()">Save character</button></div>`+data.characters.map(c=>`<div class="panel"><h3>${esc(c.name)} <span class="pill">Age ${esc(c.age)}</span></h3><p>${esc(c.style)} · ${esc(c.voice)}</p><p class="muted">AI-generated fictional adult</p><button class="danger" onclick="removeCharacter('${c.id}')">Delete</button></div>`).join('')}
if(tab==='Studio'){html=`<div class="panel"><h2>Content studio</h2><label>Character</label><select id="pc">${data.characters.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Channel</label><select id="platform"><option>Instagram</option><option>TikTok</option><option>X</option><option>Fanvue</option><option>Reddit</option></select>${field('Post title','pt')}${area('Caption / concept','caption')}${field('Media URL (optional; public HTTPS for remote publishing)','media')}<label>Scheduled date and time (optional)</label><input type="datetime-local" id="when"><div class="actions"><button onclick="suggest()">Generate caption ideas</button><button onclick="makePrompt()" class="secondary">Create image/video prompt</button><button onclick="addPost()">Save draft</button></div><pre id="suggestions" aria-live="polite"></pre></div><h2>Drafts and approvals</h2>`+data.posts.map(p=>`<div class="panel"><b>${esc(p.title)}</b> <span class="pill">${esc(p.status)}</span><p>${esc(p.platform)} · ${esc(p.caption)}</p>${p.media?`<a href="${esc(p.media)}" target="_blank" rel="noopener">Media link</a>`:''}<p class="muted">${esc(p.when||'Not scheduled')}</p><div class="actions"><button onclick="changePost('${p.id}','Approved')">Approve</button><button class="secondary" onclick="changePost('${p.id}','Scheduled')">Schedule</button><button class="secondary" onclick="queuePost('${p.id}')">Queue for backend</button><button class="danger" onclick="deletePost('${p.id}')">Delete</button></div></div>`).join('')}
if(tab==='Calendar'){html='<h2>Content calendar</h2><p class="muted">Dates shown in your device timezone. Calendar scheduling is local until a backend is configured.</p>'+data.posts.filter(p=>p.when).sort((a,b)=>a.when.localeCompare(b.when)).map(p=>`<div class="panel"><b>${esc(p.when.replace('T',' '))}</b><p>${esc(p.title)} — ${esc(p.platform)} <span class="pill">${esc(p.status)}</span></p></div>`).join('')}
if(tab==='Companion'){html=`<div class="panel"><h2>AI companion reply studio</h2><p class="muted">For fictional AI personas only. Always disclose automation. No live subscriber messaging until authorized API access is configured.</p><label>Character</label><select id="cc">${data.characters.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>${area('Fan message (do not paste sensitive personal data)','incoming')}<button onclick="draftReply()">Draft disclosed AI reply</button><pre id="reply"></pre></div><h2>Saved reply drafts</h2>`+data.messages.map(m=>`<div class="panel"><p>${esc(m.reply)}</p><button class="secondary" onclick="navigator.clipboard.writeText(${JSON.stringify('')}.concat(decodeURIComponent('${encodeURIComponent('')}')))" style="display:none">Copy</button><span class="pill">Draft only</span></div>`).join('')}
if(tab==='Analytics'){html=`<div class="panel"><h2>Add analytics entry</h2>${field('Date','ad',new Date().toISOString().slice(0,10),'date')}${field('Platform','ap','Instagram')}${field('Followers','af','0','number')}${field('Views','av','0','number')}${field('Revenue ($)','ar','0','number')}<button onclick="addMetric()">Save entry</button></div>`+data.metrics.map(m=>`<div class="panel">${esc(m.date)} · ${esc(m.platform)}<p>${esc(m.followers)} followers · ${esc(m.views)} views · $${esc(m.revenue)} revenue</p></div>`).join('')}
if(tab==='Integrations'){html=`<div class="panel"><h2>Integration readiness</h2><p>Backend connection: <b>${data.settings.backend?'Configured (not necessarily reachable)':'Not configured'}</b></p>${field('Your HTTPS backend URL','backend',data.settings.backend)}<button onclick="setBackend()">Save backend URL</button> <button class="secondary" onclick="health()">Test connection</button><pre id="health"></pre></div><div class="panel"><h3>Image / video generation</h3><p>POST /api/generate → returns a job ID; GET /api/jobs/:id → status and output URL. A licensed model and remote GPU provider must be connected to your backend. No free unlimited GPU is promised.</p><h3>Authorized publishing</h3><p>POST /api/publish → server validates approvals and OAuth tokens. Instagram professional-account publishing requires Meta permissions. Fanvue uses authorized OAuth access when granted.</p><h3>Companion messaging</h3><p>POST /api/chat → server calls a permitted language model; output must disclose AI. Sending to fans requires a separate approved messaging integration.</p></div>`}
if(tab==='Settings'){html=`<div class="panel"><h2>Settings and backups</h2><label><input style="width:auto" type="checkbox" id="approval" ${data.settings.approval?'checked':''}> Require approval before publishing</label><p class="muted">Publishing safeguards are mandatory in the supplied backend example.</p><button onclick="data.settings.approval=$('#approval').checked;save();note('Saved')">Save</button><hr><div class="actions"><button onclick="exportData()">Export JSON backup</button><button class="secondary" onclick="$('#import').click()">Import backup</button><input hidden type="file" id="import" accept="application/json" onchange="importData(this)"></div><p class="muted">Browser localStorage is device-specific and can be erased. Export regular backups. Do not store API secrets here.</p></div>`}$('#view').innerHTML=html}
function addCharacter(){let age=Number($('#ca').value);if(age<18||!Number.isFinite(age))return note('Character must be an adult (18+)');if(!$('#cn').value.trim())return note('Enter a name');data.characters.push({id:uid(),name:$('#cn').value,age,style:$('#cs').value,voice:$('#cv').value});save();render()};function removeCharacter(id){if(confirm('Delete character?')){data.characters=data.characters.filter(c=>c.id!==id);save();render()}}function addPost(){if(!$('#pt').value.trim())return note('Enter title');data.posts.unshift({id:uid(),character:$('#pc').value,platform:$('#platform').value,title:$('#pt').value,caption:$('#caption').value,media:$('#media').value,when:$('#when').value,status:'Draft'});save();render()};function changePost(id,status){let p=data.posts.find(p=>p.id===id);if(p){p.status=status;save();render()}}function deletePost(id){data.posts=data.posts.filter(p=>p.id!==id);save();render()};function suggest(){let c=data.characters.find(c=>c.id===$('#pc').value);let topic=$('#caption').value||'a fun day in my fictional world';$('#suggestions').textContent=[`1. ${c.name} here ✨ ${topic}. What's your take? (AI-created character)`,`2. Plot twist: ${topic}. Tell me your funniest version 😂 #VirtualInfluencer`,`3. A little glamour, a little chaos. ${topic}. Fictional AI persona.`].join('\n\n')};function makePrompt(){let c=data.characters.find(c=>c.id===$('#pc').value);$('#suggestions').textContent=`IMAGE PROMPT: Original fictional adult ${c.age}-year-old woman named ${c.name}; ${c.style}; expressive editorial fashion portrait; consistent distinctive features; no celebrity likeness; natural lighting; high-quality photography; safe for the selected platform. Scene: ${$('#caption').value||'city cafe'}.\n\nVIDEO PROMPT: Same adult fictional character and outfit; 6-second cinematic motion, natural facial expression, stable identity, no voice imitation.\n\nConfirm model commercial rights and content policy before generating.`};function addMetric(){data.metrics.unshift({id:uid(),date:$('#ad').value,platform:$('#ap').value,followers:Number($('#af').value),views:Number($('#av').value),revenue:Number($('#ar').value)});save();render()};function draftReply(){let c=data.characters.find(c=>c.id===$('#cc').value);let input=$('#incoming').value.trim();if(!input)return note('Enter a message');let reply=`[AI-generated reply from fictional character ${c.name}] Hey! Thanks for reaching out 💜 I love hearing from you. You mentioned: “${input.slice(0,120)}”. Tell me more!`;$('#reply').textContent=reply;data.messages.unshift({id:uid(),reply});save()};function setBackend(){let url=$('#backend').value.trim();if(url&&!/^https:\/\//.test(url))return note('Use an HTTPS backend URL');data.settings.backend=url.replace(/\/$/,'');save();render()};async function health(){if(!data.settings.backend)return note('Configure a backend first');try{let r=await fetch(data.settings.backend+'/api/health');$('#health').textContent=JSON.stringify(await r.json(),null,2)}catch(e){$('#health').textContent='Connection failed: '+e.message}}async function queuePost(id){let p=data.posts.find(p=>p.id===id);if(p.status!=='Approved'&&p.status!=='Scheduled')return note('Approve the post first');if(!data.settings.backend)return note('No backend configured. Post remains local.');try{let r=await fetch(data.settings.backend+'/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let j=await r.json();note(j.message||j.error||'Request completed')}catch(e){note('Unable to reach backend: '+e.message)}}function exportData(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='virtual-creator-studio-backup.json';a.click();URL.revokeObjectURL(a.href)}async function importData(el){try{let j=JSON.parse(await el.files[0].text());if(!Array.isArray(j.characters)||!Array.isArray(j.posts)||!Array.isArray(j.metrics))throw Error('Invalid backup');data=j;save();render();note('Imported')}catch(e){note('Import failed: '+e.message)}}render();</script></body></html>
